services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bullseye
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccip
      POSTGRES_PASSWORD: ccip_dev_password
      POSTGRES_DB: ccip
    ports:
      - "5432:5432"
    volumes:
      - ccip-postgres-data:/var/lib/postgresql/data

volumes:
  ccip-postgres-data:
