services:
  postgres:
    image: postgres:16
    container_name: ccip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccip_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ccip}
    ports:
      - "5432:5432"
    volumes:
      - ccip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccip} -d ${POSTGRES_DB:-ccip}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ccip_postgres_data:
