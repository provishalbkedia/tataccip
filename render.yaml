services:
  - type: web
    name: ccip-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=apps/api
    # Seeding runs on every start too (not just once) because Render's free
    # tier has no Shell access to run it manually — seed.ts only upserts, so
    # this is safe to repeat and never touches real data added later.
    startCommand: npm run prisma:deploy --workspace=apps/api && npm run prisma:seed --workspace=apps/api && npm run start:prod --workspace=apps/api
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      # Set this to your Supabase "Session pooler" connection string (NOT
      # "Direct connection" — Supabase's direct host is IPv6-only unless you
      # pay for their IPv4 add-on, and Render's egress is IPv4-only, so the
      # direct connection can't be reached from here and migrate/queries
      # will time out. Session pooler is IPv4-compatible and, unlike the
      # transaction pooler on :6543, behaves like a normal persistent
      # connection with no prepared-statement caveats for Prisma migrate.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Your Vercel web app URL, e.g. https://tataccip.vercel.app — leave
      # unset during initial setup and CORS will reflect any origin; lock it
      # down once the web app's URL is known.
      - key: WEB_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@ccip.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
